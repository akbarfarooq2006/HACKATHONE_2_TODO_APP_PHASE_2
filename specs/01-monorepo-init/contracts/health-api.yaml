openapi: 3.0.3
info:
  title: Phase 2 Todo App Backend - Health Check API
  description: |
    Health check endpoint for the Phase 2 Todo App backend service.
    This endpoint is used to verify that the backend service is running and responsive.
  version: 0.1.0
  contact:
    name: Phase 2 Development Team

servers:
  - url: http://localhost:8000
    description: Local development server
  - url: http://localhost:8001
    description: Local development server (alternate port)

paths:
  /api/v1/health:
    get:
      summary: Health Check
      description: |
        Returns the health status of the backend service.
        This endpoint requires no authentication and is intended for monitoring,
        load balancers, and development verification.
      operationId: healthCheck
      tags:
        - Health
      responses:
        '200':
          description: Service is healthy and operational
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              examples:
                healthy:
                  summary: Healthy service response
                  value:
                    status: healthy
                    service: backend
                    version: 0.1.0
        '500':
          description: Service is unhealthy or experiencing issues
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                unhealthy:
                  summary: Unhealthy service response
                  value:
                    status: unhealthy
                    service: backend
                    version: 0.1.0
                    error: Internal server error

components:
  schemas:
    HealthResponse:
      type: object
      required:
        - status
        - service
        - version
      properties:
        status:
          type: string
          enum:
            - healthy
            - unhealthy
          description: Current health status of the service
          example: healthy
        service:
          type: string
          description: Name of the service
          example: backend
        version:
          type: string
          description: Current version of the service
          pattern: '^\d+\.\d+\.\d+$'
          example: 0.1.0
        timestamp:
          type: string
          format: date-time
          description: ISO 8601 timestamp of the health check (optional)
          example: '2026-01-09T12:00:00Z'
        uptime:
          type: number
          format: float
          description: Service uptime in seconds (optional, for future enhancement)
          example: 3600.5

    ErrorResponse:
      type: object
      required:
        - status
        - service
        - version
        - error
      properties:
        status:
          type: string
          enum:
            - unhealthy
          description: Health status indicating service issues
          example: unhealthy
        service:
          type: string
          description: Name of the service
          example: backend
        version:
          type: string
          description: Current version of the service
          example: 0.1.0
        error:
          type: string
          description: Error message describing the issue
          example: Database connection failed

tags:
  - name: Health
    description: Service health and monitoring endpoints

externalDocs:
  description: Phase 2 Todo App Specification
  url: ../spec.md
